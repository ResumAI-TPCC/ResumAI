name: Production CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag'
        required: true
        default: ''
      deploy_backend:
        description: 'Deploy backend (true/false)'
        required: false
        default: 'true'
      deploy_frontend:
        description: 'Deploy frontend (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read
  id-token: write

env:
  PROD_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PROD_WORKLOAD_IDENTITY_PROVIDER }}
  PROD_DEPLOY_SERVICE_ACCOUNT: ${{ vars.PROD_DEPLOY_SERVICE_ACCOUNT }}
  PROD_RUNTIME_SERVICE_ACCOUNT: cloud-run-prod-runtime@resumai-platform.iam.gserviceaccount.com
  PROD_GEMINI_SECRET: prod-gemini-api-key

jobs:
  validate-branch:
    name: Validate branch is main
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ github.ref }}
    steps:
      - name: Fail if not main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Workflow can only be run on the 'main' branch. Current ref: $GITHUB_REF";
            exit 1;
          fi

  verify-wif:
    name: Verify production WIF authentication
    needs: validate-branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment configuration
        run: |
          test -n "${PROD_WORKLOAD_IDENTITY_PROVIDER}" || (echo "Missing repository variable PROD_WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "${PROD_DEPLOY_SERVICE_ACCOUNT}" || (echo "Missing repository variable PROD_DEPLOY_SERVICE_ACCOUNT" && exit 1)

      - name: 'Google auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.PROD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PROD_DEPLOY_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Verify project access
        run: gcloud projects describe resumai-platform --format='value(projectId)'

  deploy-backend:
    name: Deploy Backend to Cloud Run (prod)
    needs: [validate-branch, verify-wif]
    if: ${{ github.event.inputs.deploy_backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "${PROD_WORKLOAD_IDENTITY_PROVIDER}" || (echo "Missing repository variable PROD_WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "${PROD_DEPLOY_SERVICE_ACCOUNT}" || (echo "Missing repository variable PROD_DEPLOY_SERVICE_ACCOUNT" && exit 1)

      - name: 'Google auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.PROD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PROD_DEPLOY_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Configure Docker'
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: 'Build and Push Container'
        run: |
          docker build -t gcr.io/${{ secrets.PROD_GCP_PROJECT_ID }}/backend-prod:${{ github.sha }} -f Dockerfile .
          docker push gcr.io/${{ secrets.PROD_GCP_PROJECT_ID }}/backend-prod:${{ github.sha }}

      - name: 'Deploy to Cloud Run'
        env:
          ALLOWED_ORIGINS: ${{ secrets.PROD_ALLOWED_ORIGINS }}
          LLM_PROVIDER: ${{ secrets.PROD_LLM_PROVIDER }}
          GEMINI_MODEL: ${{ secrets.PROD_GEMINI_MODEL }}
          GCP_PROJECT_ID: ${{ secrets.PROD_GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.PROD_GCS_BUCKET_NAME }}
          GCS_OBJECT_PREFIX: ${{ secrets.PROD_GCS_OBJECT_PREFIX }}
          APP_VERSION: ${{ github.event.inputs.version }}
        run: |
          gcloud run deploy prod-service \
            --image gcr.io/${{ secrets.PROD_GCP_PROJECT_ID }}/backend-prod:${{ github.sha }} \
            --region asia-southeast1 \
            --platform managed \
            --service-account "${PROD_RUNTIME_SERVICE_ACCOUNT}" \
            --port 8000 \
            --allow-unauthenticated \
            --update-env-vars "LLM_PROVIDER=$LLM_PROVIDER" \
            --update-env-vars "GEMINI_MODEL=$GEMINI_MODEL" \
            --update-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID" \
            --update-env-vars "GCS_BUCKET_NAME=$GCS_BUCKET_NAME" \
            --update-env-vars "GCS_OBJECT_PREFIX=$GCS_OBJECT_PREFIX" \
            --update-env-vars "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" \
            --update-env-vars "APP_VERSION=$APP_VERSION" \
            --update-secrets "GEMINI_API_KEY=${PROD_GEMINI_SECRET}:latest"

  deploy-frontend:
    name: Deploy Frontend to Firebase (prod)
    needs: [validate-branch, verify-wif]
    if: ${{ github.event.inputs.deploy_frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "${PROD_WORKLOAD_IDENTITY_PROVIDER}" || (echo "Missing repository variable PROD_WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "${PROD_DEPLOY_SERVICE_ACCOUNT}" || (echo "Missing repository variable PROD_DEPLOY_SERVICE_ACCOUNT" && exit 1)

      - name: 'Google auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.PROD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PROD_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build project
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_VITE_API_BASE_URL }}
          VITE_APP_VERSION: ${{ github.event.inputs.version }}

      - name: Deploy to Firebase Hosting
        working-directory: frontend
        run: >-
          npx --yes firebase-tools@14.22.0 deploy
          --only hosting:app_site
          --project resumai-platform
          --non-interactive
