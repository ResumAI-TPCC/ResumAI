name: Frontend CD (Firebase)

on:
  workflow_run:
    workflows:
      - "Frontend CI (Test and Lint)"
    types:
      - completed
    branches:
      - develop

env:
  DEPLOY_BRANCH: develop
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

jobs:
  validate-workflow-run:
    name: Validate workflow_run source
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless CI completed on deploy branch
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Frontend CI did not complete successfully. Conclusion: ${{ github.event.workflow_run.conclusion }}"
            exit 1
          fi

          if [ "${{ github.event.workflow_run.event }}" != "push" ]; then
            echo "Deployment only runs for push-triggered CI runs. Event: ${{ github.event.workflow_run.event }}"
            exit 1
          fi

          if [ "${{ github.event.workflow_run.head_branch }}" != "${DEPLOY_BRANCH}" ]; then
            echo "Deployment only runs from ${DEPLOY_BRANCH}. Head branch: ${{ github.event.workflow_run.head_branch }}"
            exit 1
          fi

  deploy:
    needs: validate-workflow-run
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment configuration
        run: |
          test -n "${WORKLOAD_IDENTITY_PROVIDER}" || (echo "Missing repository variable WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "${DEPLOY_SERVICE_ACCOUNT}" || (echo "Missing repository variable DEPLOY_SERVICE_ACCOUNT" && exit 1)

      - name: 'Google auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build project
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_VERSION: QA

      # Same deploy path as prod-cd.yml: WIF credentials + pinned firebase-tools.
      - name: Deploy to Firebase Hosting
        working-directory: frontend
        run: >-
          npx --yes firebase-tools@14.22.0 deploy
          --only hosting:platform_site
          --project resumai-platform
          --non-interactive
