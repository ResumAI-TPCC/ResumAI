name: Frontend CD (Firebase)

on:
  workflow_run:
    workflows:
      - "Frontend CI (Test and Lint)"
    types:
      - completed
    branches:
      - develop

env:
  DEPLOY_BRANCH: develop

jobs:
  validate-workflow-run:
    name: Validate workflow_run source
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless CI completed on deploy branch
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Frontend CI did not complete successfully. Conclusion: ${{ github.event.workflow_run.conclusion }}"
            exit 1
          fi

          if [ "${{ github.event.workflow_run.event }}" != "push" ]; then
            echo "Deployment only runs for push-triggered CI runs. Event: ${{ github.event.workflow_run.event }}"
            exit 1
          fi

          if [ "${{ github.event.workflow_run.head_branch }}" != "${DEPLOY_BRANCH}" ]; then
            echo "Deployment only runs from ${DEPLOY_BRANCH}. Head branch: ${{ github.event.workflow_run.head_branch }}"
            exit 1
          fi

  deploy:
    needs: validate-workflow-run
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build project
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_VERSION: QA

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: resumai-platform
          target: platform_site
          channelId: live
          entryPoint: frontend
