name: Backend CD (Deploy to Cloud Run)

on:
  workflow_run:
    workflows:
      - "Backend CI (Test and Lint)"
    types:
      - completed
    branches:
      - develop

permissions:
  contents: 'read'
  id-token: 'write'

env:
  PROJECT_ID: resumai-platform
  REGION: asia-southeast1
  SERVICE_NAME: test-service
  IMAGE_NAME: backend-test
  WORKLOAD_IDENTITY_PROVIDER: projects/367288272676/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: deploy-staging@resumai-platform.iam.gserviceaccount.com
  ALLOWED_ORIGINS: https://resumai-platform.web.app
  LLM_PROVIDER: gemini
  GEMINI_MODEL: gemini-3-flash-preview
  GCS_BUCKET_NAME: resumai-platform-resumes
  GCS_OBJECT_PREFIX: resumes

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success'}}
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: 'Google auth'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: 'Configure Docker'
      run: |
        gcloud auth configure-docker gcr.io --quiet

    - name: 'Build and Push Container'
      run: |
        docker build -t gcr.io/${PROJECT_ID}/${IMAGE_NAME}:${{ github.event.workflow_run.head_sha }} -f Dockerfile .
        docker push gcr.io/${PROJECT_ID}/${IMAGE_NAME}:${{ github.event.workflow_run.head_sha }}

    - name: 'Deploy to Cloud Run'
      run: |
        gcloud run deploy ${SERVICE_NAME} \
          --image gcr.io/${PROJECT_ID}/${IMAGE_NAME}:${{ github.event.workflow_run.head_sha }} \
          --region ${REGION} \
          --platform managed \
          --port 8000 \
          --no-allow-unauthenticated \
          --update-env-vars "LLM_PROVIDER=$LLM_PROVIDER" \
          --update-env-vars "GEMINI_MODEL=$GEMINI_MODEL" \
          --update-env-vars "GCP_PROJECT_ID=$PROJECT_ID" \
          --update-env-vars "GCS_BUCKET_NAME=$GCS_BUCKET_NAME" \
          --update-env-vars "GCS_OBJECT_PREFIX=$GCS_OBJECT_PREFIX" \
          --update-env-vars "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" \
          --update-env-vars "APP_VERSION=QA" \
          --update-secrets "GEMINI_API_KEY=gemini-api-key:1"
